# SPA: qualquer rota que nao seja um arquivo estatico existente cai no
# index.html - o Angular Router assume dali (senao, dar F5 em "/produtos"
# devolveria 404 do nginx em vez da tela).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
